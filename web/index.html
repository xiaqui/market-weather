<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e3f2ec">
  <title>Market Weather</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">MARKET WEATHER</p>
      <h1>本日の金融天気予報</h1>
      <p id="generated">予報を読み込み中…</p>
    </header>
    <section id="markets" class="markets" aria-live="polite"></section>
    <p id="error" class="error" hidden>予報データを読み込めませんでした。時間をおいて再度お試しください。</p>
  </main>
  <dialog id="detail"><div id="detail-content"></div><button id="close-detail" type="button">閉じる</button></dialog>
  <script src="app.js" defer></script>
</body>
</html>
