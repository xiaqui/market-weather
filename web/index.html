<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e3f2ec">
  <title>Market Weather</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">MARKET WEATHER</p>
      <h1>次営業日の金融予報 <span id="generated">読み込み中…</span></h1>
    </header>
    <section id="current-status" class="current-status" hidden aria-live="polite">
      <p id="current-status-line">現在値: 取得状況を確認中…</p>
      <p id="current-status-detail"></p>
      <details id="current-status-diagnostics" hidden>
        <summary>診断情報</summary>
        <ul id="current-status-list"></ul>
      </details>
    </section>
    <section id="markets" class="markets" aria-live="polite"></section>
    <p id="error" class="error" hidden>予報データを読み込めませんでした。時間をおいて再度お試しください。</p>
  </main>
  <dialog id="detail"><div id="detail-content"></div><button id="close-detail" type="button">閉じる</button></dialog>
  <script src="app.js" defer></script>
</body>
</html>
