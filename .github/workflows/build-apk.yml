name: Build Android APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Sync forecast data
        run: python3 scripts/sync_forecast.py
      - name: Run unit tests
        working-directory: android
        run: ./gradlew test
      - name: Build debug APK
        working-directory: android
        run: ./gradlew renameDebugApk
      - uses: actions/upload-artifact@v4
        with:
          name: market-weather-debug
          path: android/app/build/outputs/apk/market-weather/market-weather-debug.apk
          if-no-files-found: error
