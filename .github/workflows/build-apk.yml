name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin
      - name: Prepare fixed APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Fixed signing secrets are not configured; this run will use the runner debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/market-weather-signing.jks"
          echo "MW_KEYSTORE_FILE=$RUNNER_TEMP/market-weather-signing.jks" >> "$GITHUB_ENV"
          echo "MW_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MW_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MW_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Sync forecast data
        run: python3 scripts/sync_forecast.py
      - name: Run unit tests
        working-directory: android
        run: ./gradlew test
      - name: Build debug APK
        working-directory: android
        run: ./gradlew renameDebugApk
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: market-weather-debug
          path: android/app/build/outputs/apk/market-weather/market-weather-debug.apk
          if-no-files-found: error
