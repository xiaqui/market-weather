name: Update Daily Forecast

on:
  workflow_dispatch:
  schedule:
    # Refresh after the Japan cash-market close (16:00 JST).
    - cron: "0 7 * * 1-5"
    # Build horizon-aligned USD/JPY and Gold forecasts before their ET opens.
    # 20:00 UTC is before USD/JPY 17:00 ET and Gold 18:00 ET in EST and EDT.
    - cron: "0 20 * * 0-4"
    # Refresh again after the US cash-market close (07:30 JST on the following day).
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-daily-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch completed market data
        run: python scripts/fetch_market_data.py ${{ github.event.schedule == '0 20 * * 0-4' && '--preopen-overnight-targets' || '' }}

      - name: Sync forecast copies
        run: python scripts/sync_forecast.py

      - name: Save prospective forecast snapshot
        run: python -m scripts.save_live_forecast

      - name: Score prospective forecasts
        run: python -m scripts.score_live_forecast

      - name: Build official representative scores
        run: python -m scripts.build_official_scores

      - name: Commit updated forecasts
        run: |
          if test -z "$(git status --porcelain -- \
            shared/forecast.json \
            android/app/src/main/assets/forecast.json \
            android/app/src/test/resources/forecast.json \
            web/forecast.json \
            reports/live-forecast \
            reports/live-forecast-history.json \
            web/official-scores.json)"; then
            echo "Forecast data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            shared/forecast.json \
            android/app/src/main/assets/forecast.json \
            android/app/src/test/resources/forecast.json \
            web/forecast.json \
            reports/live-forecast \
            reports/live-forecast-history.json \
            web/official-scores.json
          git commit -m "Update daily market forecast"
          git push origin HEAD:main
