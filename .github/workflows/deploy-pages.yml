name: Deploy Web to GitHub Pages
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Update Daily Forecast]
    types: [completed]
  push:
    branches: [main]
    paths: [web/**, shared/forecast.json, scripts/sync_forecast.py, scripts/build_official_scores.py, reports/live-forecast-history.json, .github/workflows/deploy-pages.yml]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync forecast data
        run: python3 scripts/sync_forecast.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
